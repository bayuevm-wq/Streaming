name: app

# Memastikan aplikasi Next.js tetap bisa di-lint, dicek tipe, dan di-build. Gagal bila salah satunya rusak.
# (Uji database ada di workflow db-tests.)
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tipe, dan build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nilai publik DUMMY: build tidak menghubungi Supabase, tetapi variabel NEXT_PUBLIC_* disisipkan saat build.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-untuk-ci
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000BB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Tipe rute (PageProps, LayoutProps, RouteContext) dihasilkan Next.js; tsc perlu itu.
      - name: Tipe
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build

      # Design system: token warna harus lolos kontras WCAG dan status harus berbeda dari kobalt.
      - name: Kontras token
        run: npm run test:contrast

      # Slider bisa dipakai dengan keyboard, fokus terlihat, sudut tajam, nomor lagu mengecil di <= 640px.
      # Dijalankan di Chrome sungguhan terhadap build produksi.
      - name: Uji keyboard dan tampilan (Chrome)
        run: |
          npx next start -p 3000 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:3000/gaya
          BASE_URL=http://127.0.0.1:3000 npm run test:keyboard

      # cn() memakai tailwind-merge: kelas bertabrakan diselesaikan dan token kustom terdaftar.
      - name: Uji cn()
        run: npm run test:cn

      # Logika pemutar (antrean, auto-lanjut, balapan "Berikutnya", galat, autoplay ditolak) dengan audio palsu.
      - name: Uji logika pemutar
        run: npm run test:player
      - name: Uji unit suka (UI optimistis + rollback)
        run: npm run test:likes
      - name: Uji unit format durasi
        run: npm run test:format
      - name: Uji unit aturan playlist (nama, batas, pesan galat)
        run: npm run test:playlists
      - name: Uji unit cache URL lagu pribadi (fallback Safari, S4)
        run: npm run test:private-url
