name: db-tests

# Spike S6 (docs/architecture.md, 14.1): seluruh uji SQL dan konkurensi dijalankan terhadap Supabase CLI
# sungguhan (supabase start + db reset), bukan Postgres tiruan. Runner ubuntu-latest sudah memiliki Docker.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    name: SQL dan konkurensi (Supabase CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Secret uji resmi Cloudflare Turnstile (selalu lolos). Dibaca supabase/config.toml lewat env().
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v4

      # Versi dikunci agar run tidak berubah diam-diam saat CLI baru terbit (CLI menentukan tag image Postgres,
      # GoTrue, Storage, dan PostgREST yang dipakai). Naikkan sengaja: ubah nilai ini lalu lihat hasil run.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Versi CLI harus sama dengan yang dikunci
        run: |
          supabase --version
          [ "$(supabase --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" = "3.0.0" ]

      # Hanya layanan yang dibutuhkan uji: db, auth (skema auth), storage (skema storage), postgrest/kong.
      - name: supabase start
        run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: supabase db reset (menerapkan semua migrasi)
        run: supabase db reset

      - name: Uji SQL
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/tests/sql/helpers.sql
          psql "$PGURL" -q -f supabase/tests/sql/rls_and_limits.test.sql > test.out 2>&1 || true
          grep -E "NOTICE:  PASS|WARNING:  FAIL|ERROR:" test.out || true
          pass=$(grep -c "NOTICE:  PASS" test.out || true)
          fail=$(grep -c "WARNING:  FAIL" test.out || true)
          err=$(grep -c "ERROR:" test.out || true)
          echo "PASS=$pass FAIL=$fail ERROR=$err"
          # gagal bila ada FAIL atau ERROR, atau bila jumlah PASS menyusut (uji terlewat diam-diam)
          [ "$fail" = 0 ] && [ "$err" = 0 ] && [ "$pass" -ge 90 ]

      - name: Uji konkurensi
        run: bash supabase/tests/concurrency.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      # S5 (trigger profiles lewat signInAnonymously sungguhan), F1 (CAPTCHA ditegakkan server),
      # S3 (auth.admin.deleteUser cascade), dan isolasi dua pengunjung lewat API.
      - name: Uji API Auth anonim
        run: |
          echo "variabel dari supabase status: $(supabase status -o env | cut -d= -f1 | tr '\n' ' ')"
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          node supabase/tests/api/anonymous-signin.test.mjs

      - name: Uji offline (validator MP3 dan aturan katalog seed)
        run: |
          npm run test:audio
          npm run test:seed

      # F20: skrip keep-alive yang SAMA dengan yang dipakai workflow harian, diuji terhadap ping() asli.
      - name: Uji keep-alive
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          # 1) berhasil terhadap ping() asli (format respons "ok": true dari PostgREST)
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}" bash scripts/keepalive.sh | tee ping.out
          grep -q '"ok"' ping.out
          # 2) secret belum diatur: lewati tanpa error
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY bash scripts/keepalive.sh | grep -q "dilewati"
          # 3) kunci salah: HARUS gagal (non-zero), bukan lolos diam-diam
          if SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="kunci-salah" bash scripts/keepalive.sh; then
            echo "keep-alive dengan kunci salah seharusnya gagal"; exit 1
          fi
          echo "keep-alive: 3 skenario sesuai harapan"

      # F9: seed berkas sintetis ke bucket publik, idempoten, dan klien tak bisa menulis katalog.
      - name: Uji integrasi seed
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          node supabase/tests/api/seed.test.mjs

      - name: Diagnosa (hanya bila gagal)
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          docker logs supabase_db_streaming 2>&1 | tail -80 || true

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup
