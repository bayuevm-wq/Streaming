name: e2e

# Uji end-to-end (Playwright, Google Chrome) terhadap build produksi + Supabase CLI lokal + katalog contoh sintetis.
# Pembuktian spec F2: audio.currentTime terus naik saat berpindah antar rute internal.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: "Perbarui tangkapan layar di docs/images/fase2 dan commit ke cabang ini (hanya jalan manual, tidak pernah otomatis)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chrome) terhadap Supabase lokal
    runs-on: ubuntu-latest
    # Durasi normal ±14 menit: supabase start+reset ±1,2 mnt, build ±0,2 mnt, WebKit ±0,5 mnt (cache panas ±5 dtk),
    # Playwright ±4,6 mnt, Lighthouse (7 halaman x 5 run) ±3,5 mnt. Batas 40 menit memberi ruang tanpa menyembunyikan hang:
    # langkah yang rawan (apt, unduhan, Playwright, Lighthouse) punya timeout sendiri yang lebih ketat.
    timeout-minutes: 40
    permissions:
      contents: write # hanya dipakai langkah pembaruan tangkapan layar manual; run biasa tidak menulis apa pun
    env:
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000BB
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: supabase start dan db reset
        run: |
          supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase db reset

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # WebKit (spike S4). Dipisah supaya gagal cepat dan jelas: (1) versi Playwright, (2) cache unduhan browser,
      # (3) paket sistem lewat apt, (4) unduhan browser. apt dan unduhan pernah macet >25 menit di runner GitHub
      # (run 42222913021 dan 42231527137), jadi tiap langkah punya timeout dan diulang sampai 3 kali.
      - name: Versi Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ steps.pw.outputs.version }}

      - name: Paket sistem WebKit (apt)
        timeout-minutes: 12
        run: |
          # Sebab hang yang teramati (run 42238440796, runner ubuntu-26.04): unduhan apt dari mirror macet setelah beberapa berkas;
          # timeout luar membunuh npx tetapi apt-get anaknya tetap hidup memegang kunci dpkg, sehingga ulangan gagal ("Could not
          # get lock", kode 100). Perbaikan: (1) timeout dan ulang di tingkat apt supaya unduhan yang macet gagal dengan sendirinya,
          # (2) bersihkan sisa proses apt/dpkg sebelum mengulang.
          printf 'Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::Retries "5";
DPkg::Lock::Timeout "120";
' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for i in 1 2 3; do
            if timeout -k 10 300 npx playwright install-deps webkit; then exit 0; fi
            echo "install-deps percobaan $i gagal atau melewati batas waktu; membersihkan sisa proses apt lalu mengulang"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Unduh WebKit
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            if timeout 180 npx playwright install webkit; then exit 0; fi
            echo "unduhan percobaan $i gagal atau melewati batas waktu; mengulang"
          done
          exit 1

      - name: Variabel lingkungan dari Supabase lokal
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          } >> "$GITHUB_ENV"

      # Katalog contoh SEMENTARA (MP3 sunyi sintetis, bukan musik) sampai scripts/seed/catalog.json diisi lagu asli.
      - name: Seed katalog contoh
        run: |
          node scripts/seed/make-e2e-catalog.ts "$RUNNER_TEMP/e2e-catalog"
          node scripts/seed.ts --relaxed --catalog "$RUNNER_TEMP/e2e-catalog/catalog.json"

      - name: Build
        run: npm run build

      - name: Jalankan aplikasi
        run: |
          nohup npx next start -p 3000 > next.log 2>&1 &
          curl -fsS --retry 40 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:3000/masuk

      - name: Playwright
        timeout-minutes: 15
        run: npx playwright test

      # Lighthouse mobile pada halaman area login (median 3 run). Ambang: beranda Performance >= 85 dan Accessibility >= 90
      # (spec); halaman lain Accessibility >= 90. Hasil JSON dan ringkasan ada di artefak e2e-hasil/lighthouse.
      - name: Lighthouse
        if: always() # tetap berjalan walau E2E gagal, agar angka tersedia
        timeout-minutes: 10
        run: node scripts/lighthouse.mjs

      - name: Log aplikasi (bila gagal)
        if: failure()
        run: tail -n 80 next.log || true

      # Hanya bila dijalankan manual dengan opsi update_screenshots (Actions -> e2e -> Run workflow).
      - name: Perbarui tangkapan layar di docs/images (fase2, fase3, fase4)
        if: github.event_name == 'workflow_dispatch' && inputs.update_screenshots
        run: |
          for d in fase2 fase3 fase4; do mkdir -p "docs/images/$d"; cp test-results/shots/$d/*.png "docs/images/$d/"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada tangkapan layar."
          else
            git commit -m "Update screenshots (manual run)"
            git push
          fi

      - name: Unggah hasil (tangkapan layar, trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-hasil
          path: test-results/
          if-no-files-found: ignore

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup
